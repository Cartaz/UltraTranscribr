<text x="648" y="384" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#e1e1e1" font-weight="400">Luca ⌄</text>
<text x="543" y="420" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#e1e1e1" font-weight="400">Propongo di confermare il laboratorio del venerdì e aggiornare le famiglie entro lunedì.</text>
<rect x="543" y="462" width="78" height="34" rx="9" fill="#202020" stroke="#353535"/>
<text x="555" y="485" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#e1e1e1" font-weight="400">00:42</text>
<rect x="636" y="462" width="130" height="34" rx="9" fill="#202020" stroke="#353535"/>
<text x="648" y="485" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#e1e1e1" font-weight="400">Anna ⌄</text>
<text x="543" y="521" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#e1e1e1" font-weight="400">Per il laboratorio servono due gruppi. Posso coordinare il primo e preparare i materiali.</text>
<rect x="543" y="563" width="78" height="34" rx="9" fill="#202020" stroke="#353535"/>
<text x="555" y="586" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#e1e1e1" font-weight="400">00:50</text>
<rect x="636" y="563" width="130" height="34" rx="9" fill="#202020" stroke="#353535"/>
<text x="648" y="586" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#e1e1e1" font-weight="400">Luca ⌄</text>
<text x="543" y="622" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#e1e1e1" font-weight="400">Sono disponibile per il secondo gruppo. Verifichiamo insieme gli orari.</text>
<rect x="543" y="664" width="78" height="34" rx="9" fill="#202020" stroke="#353535"/>
<text x="555" y="687" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#e1e1e1" font-weight="400">00:58</text>
<rect x="636" y="664" width="130" height="34" rx="9" fill="#202020" stroke="#353535"/>
<text x="648" y="687" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#e1e1e1" font-weight="400">Maria ⌄</text>
<text x="543" y="723" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#e1e1e1" font-weight="400">Bene, registriamo le disponibilità e fissiamo la verifica per martedì.</text>
