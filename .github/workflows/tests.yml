name: tests
on:
  push:
    branches:
      - main
      - fix/full-bug-hunt-hardening
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: bash -n install.sh
      - run: node --check ui/web/app.js
      - run: node --check ui/web/multi_live.js
      - run: node --check ui/web/settings_cleanup.js
      - run: node --check ui/web/power_user.js
      - run: node --check ui/web/phase10.js
      - run: node --check ui/web/phase10_hardening.js
      - run: pytest -q
