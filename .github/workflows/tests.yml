name: tests
on:
  push:
    branches:
      - main
      - strategic-architecture-cleanup
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libportaudio2 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: bash -n install.sh
      - run: python -m compileall -q main.py config core ui tests
      - run: node --check ui/web/app.js
      - run: node --check ui/web/multi_live.js
      - run: node --check ui/web/settings_cleanup.js
      - run: node --check ui/web/file_history.js
      - run: node --check ui/web/meeting.js
      - name: Capture clean pytest result
        continue-on-error: true
        run: pytest -q --junitxml=/tmp/pytest.xml
      - name: Failure is not config
        continue-on-error: true
        run: python -c 'import xml.etree.ElementTree as E; r=E.parse("/tmp/pytest.xml"); bad=[c for c in r.iter("testcase") if (c.find("failure") is not None or c.find("error") is not None) and c.get("classname", "").startswith("tests.test_config")]; raise SystemExit(bool(bad))'
      - name: Failure is not core
        continue-on-error: true
        run: python -c 'import xml.etree.ElementTree as E; r=E.parse("/tmp/pytest.xml"); bad=[c for c in r.iter("testcase") if (c.find("failure") is not None or c.find("error") is not None) and c.get("classname", "").startswith("tests.test_core")]; raise SystemExit(bool(bad))'
      - name: Failure is not docs
        continue-on-error: true
        run: python -c 'import xml.etree.ElementTree as E; r=E.parse("/tmp/pytest.xml"); bad=[c for c in r.iter("testcase") if (c.find("failure") is not None or c.find("error") is not None) and c.get("classname", "").startswith("tests.test_docs")]; raise SystemExit(bool(bad))'
      - name: Failure is not UI
        continue-on-error: true
        run: python -c 'import xml.etree.ElementTree as E; r=E.parse("/tmp/pytest.xml"); bad=[c for c in r.iter("testcase") if (c.find("failure") is not None or c.find("error") is not None) and c.get("classname", "").startswith("tests.test_ui")]; raise SystemExit(bool(bad))'
      - name: Failure is not roadmap contract
        continue-on-error: true
        run: python -c 'import xml.etree.ElementTree as E; r=E.parse("/tmp/pytest.xml"); bad=[c for c in r.iter("testcase") if (c.find("failure") is not None or c.find("error") is not None) and "test_final_roadmap_features" in c.get("classname", "")]; raise SystemExit(bool(bad))'
      - name: Failure is not installer contract
        continue-on-error: true
        run: python -c 'import xml.etree.ElementTree as E; r=E.parse("/tmp/pytest.xml"); bad=[c for c in r.iter("testcase") if (c.find("failure") is not None or c.find("error") is not None) and "test_installation_contract" in c.get("classname", "")]; raise SystemExit(bool(bad))'
      - name: Require clean pytest
        run: pytest -q
