name: tests
on:
  push:
    branches:
      - main
      - strategic-architecture-cleanup
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libportaudio2 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: bash -n install.sh
      - run: python -m compileall -q main.py config core ui tests
      - run: node --check ui/web/app.js
      - run: node --check ui/web/multi_live.js
      - run: node --check ui/web/settings_cleanup.js
      - run: node --check ui/web/file_history.js
      - run: node --check ui/web/meeting.js
      - name: Collect default order
        run: pytest --collect-only -q | grep '::' > /tmp/default-tests.txt
      - name: Collect explicit order
        run: pytest --collect-only -q tests/test_config tests/test_core tests/test_docs tests/test_final_roadmap_features.py tests/test_installation_contract.py tests/test_ui | grep '::' > /tmp/explicit-tests.txt
      - name: Compare collected test set
        continue-on-error: true
        run: diff -u <(sort /tmp/default-tests.txt) <(sort /tmp/explicit-tests.txt)
        shell: bash
      - name: Compare collection order
        continue-on-error: true
        run: diff -u /tmp/default-tests.txt /tmp/explicit-tests.txt
      - name: Run explicit complete suite
        continue-on-error: true
        run: pytest -q tests/test_config tests/test_core tests/test_docs tests/test_final_roadmap_features.py tests/test_installation_contract.py tests/test_ui
      - run: pytest -q
